spring.application.name=Social Media Platform

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/selamat}
spring.datasource.username=${DB_USERNAME:selamat}
spring.datasource.password=${DB_PASSWORD:Selamat!12}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:10MB}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=9
spring.flyway.baseline-description=Existing schema before password reset

app.jwt.issuer=${JWT_ISSUER:selamat-api}
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
app.jwt.access-token-expiration-minutes=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
app.jwt.refresh-token-expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}

app.storage.s3.bucket=${AWS_S3_BUCKET:}
app.storage.s3.region=${AWS_REGION:us-east-1}
app.storage.s3.key-prefix=${AWS_S3_KEY_PREFIX:uploads}
app.storage.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}

app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:tinsae.volunteer@rnd4impact.com}
app.mail.frontend-reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:4200/reset-password}

