spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

app.jwt.issuer=selamat-integration-test
app.jwt.secret=integration-test-secret-change-me-but-keep-it-long-enough
app.jwt.access-token-expiration-minutes=15
app.jwt.refresh-token-expiration-days=30

app.mail.enabled=false
app.mail.from=test@example.com
app.mail.frontend-reset-password-url=http://localhost:4200/reset-password

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=

app.storage.s3.bucket=
app.storage.s3.region=us-east-1
app.storage.s3.key-prefix=integration-tests
app.storage.s3.public-base-url=

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
