<section class="auth-card">
  <div class="auth-header">
    <p class="eyebrow">Selamat</p>
    <h1>Choose new password</h1>
  </div>

  @if (errorMessage()) {
    <p class="form-error" role="alert">{{ errorMessage() }}</p>
  }

  @if (successMessage()) {
    <p class="form-info" role="status">{{ successMessage() }}</p>
  }

  <form [formGroup]="resetPasswordForm" (ngSubmit)="submit()" novalidate>
    <label>
      <span>New password</span>
      <input
        type="password"
        formControlName="newPassword"
        autocomplete="new-password"
        [class.invalid]="isInvalid('newPassword')"
      />
    </label>
    @if (isInvalid('newPassword')) {
      <small>Password must be between 8 and 100 characters.</small>
    }

    <button type="submit" [disabled]="resetPasswordForm.invalid || isSubmitting()">
      {{ isSubmitting() ? 'Resetting...' : 'Reset password' }}
    </button>
  </form>

  <p class="switch-link">
    <a routerLink="/login">Back to login</a>
  </p>
</section>
