<section class="auth-card">
  <div class="auth-header">
    <p class="eyebrow">Selamat</p>
    <h1>Log in</h1>
  </div>

  @if (errorMessage()) {
    <p class="form-error" role="alert">{{ errorMessage() }}</p>
  }

  @if (infoMessage()) {
    <p class="form-info" role="status">{{ infoMessage() }}</p>
  }

  <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
    <label>
      <span>Username or email</span>
      <input
        type="text"
        formControlName="identifier"
        autocomplete="username"
        [class.invalid]="isInvalid('identifier')"
      />
    </label>
    @if (isInvalid('identifier')) {
      <small>Username or email is required.</small>
    }

    <label>
      <span>Password</span>
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [class.invalid]="isInvalid('password')"
      />
    </label>
    @if (isInvalid('password')) {
      <small>Password is required.</small>
    }

    <button type="submit" [disabled]="loginForm.invalid || isSubmitting()">
      {{ isSubmitting() ? 'Logging in...' : 'Log in' }}
    </button>
  </form>

  <p class="switch-link">
    New to Selamat?
    <a routerLink="/signup">Create an account</a>
  </p>

  <p class="switch-link">
    <a routerLink="/forgot-password">Forgot password?</a>
  </p>
</section>
