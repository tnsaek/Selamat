<section class="auth-card">
  <div class="auth-header">
    <p class="eyebrow">Selamat</p>
    <h1>Reset password</h1>
  </div>

  @if (errorMessage()) {
    <p class="form-error" role="alert">{{ errorMessage() }}</p>
  }

  @if (successMessage()) {
    <p class="form-info" role="status">{{ successMessage() }}</p>
  }

  <form [formGroup]="forgotPasswordForm" (ngSubmit)="submit()" novalidate>
    <label>
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" [class.invalid]="isInvalid('email')" />
    </label>
    @if (isInvalid('email')) {
      <small>Enter a valid email address.</small>
    }

    <button type="submit" [disabled]="forgotPasswordForm.invalid || isSubmitting()">
      {{ isSubmitting() ? 'Sending...' : 'Send reset link' }}
    </button>
  </form>

  <p class="switch-link">
    Remembered your password?
    <a routerLink="/login">Log in</a>
  </p>
</section>
